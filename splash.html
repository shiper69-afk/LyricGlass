<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyricGlass</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #161220;
        box-sizing: border-box;
      }
      #splash-stage {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: max(20px, 5vmin);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash-frame {
        flex: 0 1 auto;
        width: 100%;
        height: 100%;
        max-width: 720px;
        max-height: 1080px;
        aspect-ratio: 720 / 1080;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #splash-img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="splash-stage">
      <div id="splash-frame">
        <img
          id="splash-img"
          src="/shiperverse/splash.webp"
          width="720"
          height="1080"
          alt="Shiperverse Labs"
          decoding="async"
        />
      </div>
    </div>
    <script type="module" src="/src/splash-main.ts"></script>
  </body>
</html>
