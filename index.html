<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyricGlass</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar" data-tauri-drag-region>
        <span class="brand">LyricGlass <small id="app-version">0.2.2</small></span>
        <div class="titlebar-hover-zone">
          <div class="titlebar-actions">
            <button type="button" id="btn-click" title="Click-through (Ctrl+Alt+C)">◻</button>
            <button type="button" id="btn-wallpaper" title="Wallpaper (Ctrl+Alt+W)">🖼</button>
          </div>
          <div class="settings-strip" id="settings-strip">
            <label class="setting-row">
              <span>Opacity</span>
              <input type="range" id="opacity-slider" min="30" max="100" value="62" />
            </label>
            <label class="setting-row">
              <span>Timing</span>
              <input type="range" id="timing-slider" min="-10000" max="10000" step="100" value="0" />
              <button type="button" id="timing-reset" class="mini-btn">Reset</button>
            </label>
            <span id="timing-readout" class="timing-readout">0.0s</span>
          </div>
        </div>
      </header>

      <section class="lyrics-panel" id="lyrics-root">
        <p class="np-header">
          <span id="np-title" class="np-title">—</span>
          <span id="np-artist" class="np-artist">—</span>
        </p>
        <p id="duration-warn" class="duration-warn hidden" role="status"></p>
        <p id="lyrics-status" class="lyrics-status">Waiting for Spotify…</p>
        <p id="sync-offset-label" class="sync-offset" aria-live="polite"></p>
        <div id="lyrics-lines" class="lyrics-lines" aria-live="polite"></div>
        <div id="lyrics-plain" class="lyrics-plain hidden" dir="auto"></div>
        <p class="plain-badge hidden" id="plain-badge">Untimed lyrics</p>
      </section>

      <section class="panel debug-panel hidden" id="debug-panel" aria-hidden="true">
        <div class="debug-head">
          <h2>Diagnostics</h2>
          <button type="button" id="btn-copy-diag" class="mini-btn">Copy diagnostics</button>
        </div>
        <p id="media-status" class="muted">—</p>
        <dl class="media-grid">
          <dt>Album</dt>
          <dd id="m-album">—</dd>
          <dt>Status</dt>
          <dd id="m-status">—</dd>
          <dt>GSMTC position</dt>
          <dd id="m-position-raw">—</dd>
          <dt>LastUpdated ticks</dt>
          <dd id="m-lut-ticks">—</dd>
          <dt>Timeline age</dt>
          <dd id="m-position-age">—</dd>
          <dt>Wall anchor age</dt>
          <dd id="m-wall-age">—</dd>
          <dt>Computed clock</dt>
          <dd id="m-position-smooth">—</dd>
          <dt>Rate</dt>
          <dd id="m-playback-rate">—</dd>
          <dt>Line index</dt>
          <dd id="m-line-index">—</dd>
          <dt>Timeline events</dt>
          <dd id="m-timeline-count">0</dd>
          <dt>Last event</dt>
          <dd id="m-last-event">—</dd>
        </dl>
      </section>

      <footer class="hints">
        <span>Ctrl+Alt+C/W · timing Ctrl+Alt+[ / ] ±0.1s · mark Ctrl+Alt+M</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
