<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyricGlass</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar" data-tauri-drag-region>
        <span class="brand">LyricGlass</span>
        <div class="titlebar-actions">
          <button type="button" id="btn-click" title="Click-through (Ctrl+Alt+C)">◻</button>
          <button type="button" id="btn-wallpaper" title="Wallpaper (Ctrl+Alt+W)">🖼</button>
        </div>
      </header>

      <section class="lyrics-panel" id="lyrics-root">
        <p class="np-header">
          <span id="np-title" class="np-title">—</span>
          <span id="np-artist" class="np-artist">—</span>
        </p>
        <p id="lyrics-status" class="lyrics-status">Waiting for Spotify…</p>
        <p id="sync-offset-label" class="sync-offset" aria-live="polite"></p>
        <div id="lyrics-lines" class="lyrics-lines" aria-live="polite"></div>
        <div id="lyrics-plain" class="lyrics-plain hidden" dir="auto"></div>
        <p class="plain-badge hidden" id="plain-badge">Untimed lyrics</p>
      </section>

      <section class="panel debug-panel hidden" id="debug-panel" aria-hidden="true">
        <h2>Diagnostics (Phase 0)</h2>
        <p id="media-status" class="muted">—</p>
        <dl class="media-grid">
          <dt>Album</dt>
          <dd id="m-album">—</dd>
          <dt>Status</dt>
          <dd id="m-status">—</dd>
          <dt>Reported</dt>
          <dd id="m-position-raw">—</dd>
          <dt>Smoothed</dt>
          <dd id="m-position-smooth">—</dd>
          <dt>Timeline events</dt>
          <dd id="m-timeline-count">0</dd>
          <dt>Last event</dt>
          <dd id="m-last-event">—</dd>
        </dl>
      </section>

      <footer class="hints">
        <span>Ctrl+Alt+C click-through · Ctrl+Alt+W wallpaper · Ctrl+Alt+[ / ] sync ±500ms</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
