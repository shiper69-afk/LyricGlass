<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>LyricGlass bouncers</title>
<style>
  :root {
    --lg-bouncer: #FF3F4C;
    --bg: #07141B;
    --panel: #0C232D;
    --stroke: #1A4A58;
    --text: #F4FFFE;
    --muted: #8BB8C4;
    --teal: #5ED0E0;
    --glass: rgba(126, 231, 242, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, "IBM Plex Sans Hebrew", sans-serif; }
  body { padding: 32px 28px 80px; }
  h1 { font-family: Outfit, Inter, sans-serif; font-weight: 650; font-size: 42px; margin: 4px 0 8px; }
  .eyebrow { color: var(--teal); letter-spacing: 0.18em; font-size: 12px; font-weight: 600; }
  .lede { color: var(--muted); max-width: 62ch; margin: 0 0 28px; }
  .stage {
    position: relative;
    background: linear-gradient(180deg, rgba(126,231,242,0.07), rgba(12,35,45,0.9));
    border: 1px solid rgba(126,231,242,0.28);
    border-radius: 22px;
    padding: 28px 32px 24px;
    margin: 0 0 18px;
    overflow: hidden;
  }
  .stage:before {
    content: "";
    position: absolute; left: 36px; top: 14px; width: 280px; height: 10px;
    border-radius: 99px; background: rgba(255,255,255,0.12);
  }
  .lyric {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px;
    padding: 36px 8px 8px; font-size: 30px; font-weight: 550; line-height: 1;
  }
  .lyric.he { direction: rtl; font-family: "IBM Plex Sans Hebrew", Inter, sans-serif; font-size: 26px; padding-top: 20px; color: #C5E0E6; }
  .word { position: relative; display: inline-block; padding-top: 34px; color: #9BB8C0; transition: color .15s; }
  .word.active { color: #F4FFFE; }
  .word .bo {
    position: absolute; top: 0; left: 50%; width: 24px; height: 24px;
    margin-left: -12px; opacity: 0; color: var(--lg-bouncer);
    pointer-events: none;
  }
  .word.active .bo { opacity: 1; animation: hop .42s cubic-bezier(.2,.8,.2,1); }
  .word .bo svg { width: 24px; height: 24px; display: block; overflow: visible; }
  @keyframes hop {
    0%   { transform: translateY(6px) scale(1.26, 0.70); }
    42%  { transform: translateY(-13px) scale(0.90, 1.14); }
    82%  { transform: translateY(0) scale(1.22, 0.74); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  .bo.pixel.active, .word.active .bo.pixel { animation-timing-function: steps(4, end); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin: 0 0 22px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch[aria-pressed="true"] { border-color: #F4FFFE; }
  .swatch:focus { outline: 2px solid var(--teal); outline-offset: 2px; }
  label.picker { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  select, input[type="color"] { background: var(--panel); color: var(--text); border: 1px solid var(--stroke); border-radius: 8px; padding: 6px 8px; font: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 18px;
    padding: 16px 16px 14px; cursor: pointer; text-align: left; color: inherit;
  }
  .card[aria-pressed="true"] { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
  .card .thumb { width: 72px; height: 72px; color: var(--lg-bouncer); margin: 0 auto 8px; }
  .card .thumb svg { width: 72px; height: 72px; display: block; overflow: visible; animation: idle 1.1s ease-in-out infinite; transform-origin: 50% 85%; }
  .card h3 { margin: 0 0 4px; font-size: 16px; font-family: Outfit, Inter, sans-serif; text-align: center; }
  .card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
  @keyframes idle {
    0%, 100% { transform: translateY(0) scale(1,1); }
    40% { transform: translateY(-8px) scale(0.94, 1.08); }
    75% { transform: translateY(0) scale(1.16, 0.8); }
  }
  .sizes { display: flex; gap: 8px; justify-content: center; margin: 8px 0 10px; }
  .sizes span { display: flex; align-items: center; justify-content: center; background: #07141B; border-radius: 7px; }
  .sizes .s24 { width: 40px; height: 40px; }
  .sizes .s24 svg { width: 24px; height: 24px; }
  .sizes .s16 { width: 32px; height: 32px; }
  .sizes .s16 svg { width: 16px; height: 16px; }
  .sizes .light { background: #E8F4F6; }
</style>
</head>
<body>
  <div class="eyebrow">LYRICGLASS</div>
  <h1>Bouncers</h1>
  <p class="lede">Pick a type and a colour, then watch it hop the lyric line. All twelve use <code>currentColor</code> (default coral #FF3F4C). This file is self-contained — open it in a browser, no server needed.</p>

  <div class="toolbar">
    <span style="color:var(--muted);font-size:13px;">Colour</span>
    <button class="swatch" data-color="#FF3F4C" title="Coral #FF3F4C" style="background:#FF3F4C" aria-label="Coral"></button>
    <button class="swatch" data-color="#8B6CFF" title="Violet #8B6CFF" style="background:#8B6CFF" aria-label="Violet"></button>
    <button class="swatch" data-color="#F0B429" title="Gold #F0B429" style="background:#F0B429" aria-label="Gold"></button>
    <button class="swatch" data-color="#3DDC97" title="Mint #3DDC97" style="background:#3DDC97" aria-label="Mint"></button>
    <button class="swatch" data-color="#3DB8FF" title="Sky #3DB8FF" style="background:#3DB8FF" aria-label="Sky"></button>
    <button class="swatch" data-color="#FF6BA8" title="Rose #FF6BA8" style="background:#FF6BA8" aria-label="Rose"></button>
    <label class="picker">Custom <input id="custom" type="color" value="#FF3F4C"/></label>
    <label class="picker">Type
      <select id="type">
        <option value="glow-orb">Glow Orb</option><option value="music-note">Music Note</option><option value="spark">Spark</option><option value="heart">Heart</option><option value="glass-drop">Glass Drop</option><option value="firefly">Firefly</option><option value="comet">Comet</option><option value="eq-pulse">EQ Pulse</option><option value="mic">Mic</option><option value="paper-plane">Paper Plane</option><option value="pixel">Pixel</option><option value="crescent">Crescent</option>
      </select>
    </label>
  </div>

  <div class="stage" id="stage">
    <div class="lyric" id="lyric-en"></div>
    <div class="lyric he" id="lyric-he"></div>
  </div>

  <div class="grid" id="grid"></div>

<script>
const ICONS = [{"id":"glow-orb","name":"Glow Orb","description":"The classic karaoke ball: a soft glowing orb that hops along the sung word.","motion":"Classic squash-and-stretch. Stretches tall at the top of the hop, flattens on landing, then settles. A soft glow pulses slightly louder at the apex. Optional contact shadow scales out as it leaves the word.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Glow Orb\">\n  <title>LyricGlass Glow Orb</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-glow-orb\">\n\n    <circle class=\"lg-glow\" cx=\"12\" cy=\"12.1\" r=\"8.8\" fill=\"currentColor\" opacity=\"0.16\"/>\n    <circle class=\"lg-body\" cx=\"12\" cy=\"12.1\" r=\"7.15\" fill=\"currentColor\"/>\n    <ellipse class=\"lg-shade\" cx=\"13.2\" cy=\"14.55\" rx=\"5.15\" ry=\"4.2\" fill=\"#041218\" opacity=\"0.28\"/>\n    <ellipse class=\"lg-highlight\" cx=\"9.55\" cy=\"9.55\" rx=\"3.15\" ry=\"2.25\" fill=\"#FFFFFF\" opacity=\"0.58\"/>\n    <ellipse class=\"lg-highlight-core\" cx=\"8.7\" cy=\"8.8\" rx=\"1.15\" ry=\"0.8\" fill=\"#FFFFFF\" opacity=\"0.85\"/>\n  </g>\n</svg>\n"},{"id":"music-note","name":"Music Note","description":"A chunky eighth note that marks the beat as each word is sung.","motion":"Tilts back about 18° while airborne, tips forward on landing, and lightly squashes through the note head. The flag can give a tiny delayed follow-through (it lags the stem by a frame or two).","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Music Note\">\n  <title>LyricGlass Music Note</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-music-note\">\n\n    <circle class=\"lg-glow\" cx=\"11.2\" cy=\"13.2\" r=\"9.0\" fill=\"currentColor\" opacity=\"0.12\"/>\n    <path class=\"lg-flag\" d=\"M14.9 4.1 C21.15 4.55 22.9 9.2 20.15 13.0 C17.5 10.2 15.95 8.55 14.9 8.85 Z\" fill=\"currentColor\"/>\n    <rect class=\"lg-stem\" x=\"12.72\" y=\"4.1\" width=\"2.4\" height=\"12.7\" rx=\"0.9\" fill=\"currentColor\"/>\n    <g class=\"lg-head\" transform=\"rotate(-24 9.15 16.75)\">\n      <ellipse class=\"lg-body\" cx=\"9.15\" cy=\"16.75\" rx=\"4.8\" ry=\"3.5\" fill=\"currentColor\"/>\n      <ellipse class=\"lg-highlight\" cx=\"8.1\" cy=\"15.7\" rx=\"2.2\" ry=\"1.5\" fill=\"#FFFFFF\" opacity=\"0.42\"/>\n    </g>\n  </g>\n</svg>\n"},{"id":"spark","name":"Spark","description":"A four-point sparkle star that twinkles over the active lyric.","motion":"Slowly rotates (about 20–30° per hop) and twinkles with a short scale pulse at the apex. On landing it squashes slightly along the vertical points. A one-frame “flash” (scale 1.15) can mark the start of each word.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Spark\">\n  <title>LyricGlass Spark</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-spark\">\n\n    <circle class=\"lg-glow\" cx=\"12\" cy=\"12\" r=\"9.2\" fill=\"currentColor\" opacity=\"0.14\"/>\n    <path class=\"lg-body\" d=\"M12.00,2.55L14.76,9.24L21.45,12.00L14.76,14.76L12.00,21.45L9.24,14.76L2.55,12.00L9.24,9.24Z\" fill=\"currentColor\"/>\n    <path class=\"lg-highlight\" d=\"M12.00,5.95L12.81,8.49L15.35,9.30L12.81,10.11L12.00,12.65L11.19,10.11L8.65,9.30L11.19,8.49Z\" fill=\"#FFFFFF\" opacity=\"0.42\"/>\n    <circle class=\"lg-highlight-core\" cx=\"12\" cy=\"9.1\" r=\"1.05\" fill=\"#FFFFFF\" opacity=\"0.8\"/>\n  </g>\n</svg>\n"},{"id":"heart","name":"Heart","description":"A bold heart that sits on the sung word — clear even at tray-like sizes.","motion":"Pulses (a quick beat-scale) as it lands, with a mild squash in the lower tip. Slight sideways tilt in the air, then a spring back to upright. Can double-pulse on a held note.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Heart\">\n  <title>LyricGlass Heart</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-heart\">\n\n    <circle class=\"lg-glow\" cx=\"12\" cy=\"13\" r=\"9.0\" fill=\"currentColor\" opacity=\"0.14\"/>\n    <path class=\"lg-body\" fill=\"currentColor\" d=\"M12 20.55 C12 20.55 3.45 14.7 3.45 9.2 C3.45 6.15 5.75 4.15 8.55 4.15 C10.25 4.15 11.45 5.05 12 6.4 C12.55 5.05 13.75 4.15 15.45 4.15 C18.25 4.15 20.55 6.15 20.55 9.2 C20.55 14.7 12 20.55 12 20.55 Z\"/>\n    <path class=\"lg-shade\" fill=\"#041218\" opacity=\"0.2\" d=\"M12 20.55 C12 20.55 16.8 16.4 19.2 12.2 C18.7 16.2 15.6 18.9 12 20.55 Z\"/>\n    <ellipse class=\"lg-highlight\" cx=\"8.7\" cy=\"8.05\" rx=\"2.45\" ry=\"1.85\" fill=\"#FFFFFF\" opacity=\"0.48\"/>\n    <ellipse class=\"lg-highlight-core\" cx=\"8.05\" cy=\"7.35\" rx=\"0.95\" ry=\"0.7\" fill=\"#FFFFFF\" opacity=\"0.8\"/>\n  </g>\n</svg>\n"},{"id":"glass-drop","name":"Glass Drop","description":"A glassy teardrop, like a bead of light resting on the lyric line.","motion":"Stretches into a taller drop at the apex, then a wet squash on landing (wide and short) with a short wobble (horizontal shear) as it settles. The highlight can slide up the left edge during the hop.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Glass Drop\">\n  <title>LyricGlass Glass Drop</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-glass-drop\">\n\n    <ellipse class=\"lg-glow\" cx=\"12\" cy=\"14.4\" rx=\"8.6\" ry=\"7.6\" fill=\"currentColor\" opacity=\"0.14\"/>\n    <path class=\"lg-body\" fill=\"currentColor\" d=\"M12 3.05 C13.35 5.7 20.05 11.55 20.05 15.85 C20.05 20.25 16.55 22.05 12 22.05 C7.45 22.05 3.95 20.25 3.95 15.85 C3.95 11.55 10.65 5.7 12 3.05 Z\"/>\n    <path class=\"lg-shade\" fill=\"#041218\" opacity=\"0.22\" d=\"M14.8 13.6 C17.6 15.6 17.9 18.6 15.4 20.5 C18.6 19.2 19.6 16.2 18.2 13.8 C17.2 13.1 15.8 13.1 14.8 13.6 Z\"/>\n    <path class=\"lg-highlight\" fill=\"#FFFFFF\" opacity=\"0.5\" d=\"M9.0 8.2 C8.15 10.5 7.55 13.2 7.85 15.3 C8.05 13.0 8.7 10.3 10.35 7.7 C10.0 7.7 9.45 7.85 9.0 8.2 Z\"/>\n    <ellipse class=\"lg-highlight-core\" cx=\"9.35\" cy=\"9.55\" rx=\"1.25\" ry=\"1.7\" fill=\"#FFFFFF\" opacity=\"0.8\" transform=\"rotate(-18 9.35 9.55)\"/>\n  </g>\n</svg>\n"},{"id":"firefly","name":"Firefly","description":"A tiny lantern bug: glowing abdomen, faint glass wings, and a small head.","motion":"Hover more than bounce — a softer landing with less squash, a constant idle bob, and a glow that pulses independently of the hop. Wings flutter with a short scale/rotate loop. On a held note it can hover in place and pulse.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Firefly\">\n  <title>LyricGlass Firefly</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-firefly\">\n\n    <circle class=\"lg-glow\" cx=\"12\" cy=\"13.6\" r=\"8.2\" fill=\"currentColor\" opacity=\"0.14\"/>\n    <ellipse class=\"lg-wing lg-wing-l\" cx=\"4.15\" cy=\"8.85\" rx=\"6.0\" ry=\"2.55\" transform=\"rotate(-32 4.15 8.85)\" fill=\"currentColor\" opacity=\"0.75\"/>\n    <ellipse class=\"lg-wing lg-wing-l-sheen\" cx=\"4.15\" cy=\"8.85\" rx=\"3.6\" ry=\"1.15\" transform=\"rotate(-32 4.15 8.85)\" fill=\"#FFFFFF\" opacity=\"0.38\"/>\n    <ellipse class=\"lg-wing lg-wing-r\" cx=\"19.85\" cy=\"8.85\" rx=\"6.0\" ry=\"2.55\" transform=\"rotate(32 19.85 8.85)\" fill=\"currentColor\" opacity=\"0.75\"/>\n    <ellipse class=\"lg-wing lg-wing-r-sheen\" cx=\"19.85\" cy=\"8.85\" rx=\"3.6\" ry=\"1.15\" transform=\"rotate(32 19.85 8.85)\" fill=\"#FFFFFF\" opacity=\"0.38\"/>\n    <circle class=\"lg-body\" cx=\"12\" cy=\"14.05\" r=\"6.15\" fill=\"currentColor\"/>\n    <ellipse class=\"lg-shade\" cx=\"12.9\" cy=\"16.0\" rx=\"4.0\" ry=\"3.1\" fill=\"#041218\" opacity=\"0.22\"/>\n    <ellipse class=\"lg-highlight\" cx=\"10.05\" cy=\"12.05\" rx=\"2.55\" ry=\"1.85\" fill=\"#FFFFFF\" opacity=\"0.55\"/>\n    <ellipse class=\"lg-head\" cx=\"12\" cy=\"7.15\" rx=\"2.35\" ry=\"2.15\" fill=\"currentColor\"/>\n    <ellipse cx=\"12\" cy=\"6.7\" rx=\"1.05\" ry=\"0.8\" fill=\"#FFFFFF\" opacity=\"0.42\"/>\n  </g>\n</svg>\n"},{"id":"comet","name":"Comet","description":"A bright nucleus with a trailing tail that streams behind the hop.","motion":"The nucleus uses the same squash-and-stretch as Glow Orb. The tail always streams opposite the hop direction: long and loose in the air, compressed or tucked on landing. In RTL lyrics, flip the tail with scaleX(-1) so it still trails behind.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Comet\">\n  <title>LyricGlass Comet</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-comet\">\n\n    <path class=\"lg-tail lg-tail-3\" d=\"M11.6 10.8 L1.5 2.0 L6.8 7.6 L12.6 12.6 Z\" fill=\"currentColor\" opacity=\"0.34\"/>\n    <path class=\"lg-tail lg-tail-2\" d=\"M11.4 13.6 L1.9 5.4 L7.4 9.0 L12.8 14.0 Z\" fill=\"currentColor\" opacity=\"0.55\"/>\n    <path class=\"lg-tail lg-tail-1\" d=\"M12.8 12.0 L2.8 3.0 L8.0 8.5 L13.6 13.8 Z\" fill=\"currentColor\" opacity=\"0.9\"/>\n    <circle class=\"lg-glow\" cx=\"14.35\" cy=\"14.5\" r=\"7.2\" fill=\"currentColor\" opacity=\"0.16\"/>\n    <circle class=\"lg-body\" cx=\"14.35\" cy=\"14.5\" r=\"6.35\" fill=\"currentColor\"/>\n    <ellipse class=\"lg-shade\" cx=\"15.5\" cy=\"16.55\" rx=\"4.2\" ry=\"3.4\" fill=\"#041218\" opacity=\"0.25\"/>\n    <ellipse class=\"lg-highlight\" cx=\"12.3\" cy=\"12.4\" rx=\"2.55\" ry=\"1.85\" fill=\"#FFFFFF\" opacity=\"0.58\"/>\n    <ellipse class=\"lg-highlight-core\" cx=\"11.65\" cy=\"11.8\" rx=\"0.9\" ry=\"0.65\" fill=\"#FFFFFF\" opacity=\"0.85\"/>\n  </g>\n</svg>\n"},{"id":"eq-pulse","name":"EQ Pulse","description":"Three rounded equalizer bars that bounce as a little meter on the word.","motion":"The group hops as one, but each bar independently scales in height (transform-origin at the bottom) on the beat. On landing the whole meter squashes flatter. On a held note the bars can keep pulsing in place without hopping.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"EQ Pulse\">\n  <title>LyricGlass EQ Pulse</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-eq-pulse\">\n\n    <g class=\"lg-glow\" fill=\"currentColor\" opacity=\"0.16\">\n      <rect x=\"3.25\" y=\"9.1\" width=\"4.7\" height=\"12.2\" rx=\"2.35\"/>\n      <rect x=\"9.65\" y=\"4.2\" width=\"4.7\" height=\"17.1\" rx=\"2.35\"/>\n      <rect x=\"16.05\" y=\"11.5\" width=\"4.7\" height=\"9.8\" rx=\"2.35\"/>\n    </g>\n    <rect class=\"lg-bar lg-bar-1\" x=\"3.5\" y=\"9.55\" width=\"4.2\" height=\"11.25\" rx=\"2.1\" fill=\"currentColor\" opacity=\"0.78\"/>\n    <rect class=\"lg-bar lg-bar-2\" x=\"9.9\" y=\"4.7\" width=\"4.2\" height=\"16.1\" rx=\"2.1\" fill=\"currentColor\"/>\n    <rect class=\"lg-bar lg-bar-3\" x=\"16.3\" y=\"11.95\" width=\"4.2\" height=\"8.85\" rx=\"2.1\" fill=\"currentColor\" opacity=\"0.62\"/>\n    <rect x=\"4.25\" y=\"10.1\" width=\"2.7\" height=\"2.35\" rx=\"1.15\" fill=\"#FFFFFF\" opacity=\"0.38\"/>\n    <rect x=\"10.65\" y=\"5.25\" width=\"2.7\" height=\"2.5\" rx=\"1.15\" fill=\"#FFFFFF\" opacity=\"0.42\"/>\n    <rect x=\"17.05\" y=\"12.5\" width=\"2.7\" height=\"2.15\" rx=\"1.15\" fill=\"#FFFFFF\" opacity=\"0.38\"/>\n  </g>\n</svg>\n"},{"id":"mic","name":"Mic","description":"A tiny handheld microphone — the karaoke object itself, hopping the line.","motion":"Swings like a short pendulum (about ±16°) while airborne, then squashes through the capsule on landing. A very small “sound ring” can flash around the grille at the start of a word.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Mic\">\n  <title>LyricGlass Mic</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-mic\">\n\n    <g class=\"lg-mic-rig\" transform=\"rotate(-8 12 12)\">\n      <circle class=\"lg-glow\" cx=\"12\" cy=\"11.2\" r=\"8.8\" fill=\"currentColor\" opacity=\"0.12\"/>\n      <rect class=\"lg-handle\" x=\"10.2\" y=\"14.05\" width=\"3.6\" height=\"7.3\" rx=\"1.5\" fill=\"currentColor\"/>\n      <rect class=\"lg-ferrule\" x=\"9.25\" y=\"13.3\" width=\"5.5\" height=\"2.05\" rx=\"0.7\" fill=\"currentColor\"/>\n      <rect x=\"9.25\" y=\"13.3\" width=\"5.5\" height=\"2.05\" rx=\"0.7\" fill=\"#041218\" opacity=\"0.22\"/>\n      <rect class=\"lg-body\" x=\"7.1\" y=\"2.45\" width=\"9.8\" height=\"12.15\" rx=\"4.9\" fill=\"currentColor\"/>\n      <ellipse class=\"lg-shade\" cx=\"13.15\" cy=\"10.35\" rx=\"3.65\" ry=\"3.2\" fill=\"#041218\" opacity=\"0.22\"/>\n      <rect class=\"lg-grille\" x=\"8.45\" y=\"6.65\" width=\"7.1\" height=\"2.5\" rx=\"1.25\" fill=\"#041218\" opacity=\"0.24\"/>\n      <ellipse class=\"lg-highlight\" cx=\"10.15\" cy=\"5.45\" rx=\"2.45\" ry=\"2.05\" fill=\"#FFFFFF\" opacity=\"0.48\"/>\n    </g>\n  </g>\n</svg>\n"},{"id":"paper-plane","name":"Paper Plane","description":"A folded paper dart that banks from word to word like a short flight.","motion":"Banks (rolls) into the hop, glides with the nose slightly up, then dips the nose and flattens on landing. Travel between words can include a short horizontal glide, not only a vertical bounce. In RTL, flip with scaleX(-1).","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Paper Plane\">\n  <title>LyricGlass Paper Plane</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-paper-plane\">\n\n    <path class=\"lg-glow\" d=\"M1.6 11.2 L22.2 3.5 L9.2 22.2 Z\" fill=\"currentColor\" opacity=\"0.14\"/>\n    <path class=\"lg-body\" d=\"M2.85 11.15 L21.4 4.45 L11.15 13.55 Z\" fill=\"currentColor\"/>\n    <path class=\"lg-wing\" d=\"M11.15 13.55 L21.4 4.45 L9.8 21.2 Z\" fill=\"currentColor\"/>\n    <path class=\"lg-shade\" d=\"M11.15 13.55 L21.4 4.45 L9.8 21.2 Z\" fill=\"#041218\" opacity=\"0.24\"/>\n    <path class=\"lg-highlight\" d=\"M5.15 10.9 L16.7 6.55 L11.15 13.55 Z\" fill=\"#FFFFFF\" opacity=\"0.3\"/>\n  </g>\n</svg>\n"},{"id":"pixel","name":"Pixel","description":"A chunky square pixel with a 1-bit highlight — like a cursor on the lyric.","motion":"Snappy, not fluid. The hop can be stepped (a few discrete frames) rather than eased. On landing it flattens into a wider rectangle for one frame, then pops back. Optional 1-frame “blink” (the highlight flashes) at the start of each word.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Pixel\">\n  <title>LyricGlass Pixel</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-pixel\">\n\n    <rect class=\"lg-glow\" x=\"3.5\" y=\"3.5\" width=\"17.0\" height=\"17.0\" rx=\"2.4\" fill=\"currentColor\" opacity=\"0.14\"/>\n    <rect class=\"lg-body\" x=\"4.5\" y=\"4.5\" width=\"15\" height=\"15\" rx=\"1.7\" fill=\"currentColor\"/>\n    <rect class=\"lg-shade\" x=\"4.5\" y=\"16.2\" width=\"15\" height=\"3.3\" fill=\"#041218\" opacity=\"0.24\"/>\n    <rect x=\"16.3\" y=\"4.5\" width=\"3.2\" height=\"15\" fill=\"#041218\" opacity=\"0.12\"/>\n    <rect class=\"lg-highlight\" x=\"6.5\" y=\"6.5\" width=\"5.1\" height=\"5.1\" rx=\"0.55\" fill=\"#FFFFFF\" opacity=\"0.5\"/>\n    <rect class=\"lg-highlight-core\" x=\"6.5\" y=\"6.5\" width=\"2.3\" height=\"2.3\" rx=\"0.3\" fill=\"#FFFFFF\" opacity=\"0.85\"/>\n  </g>\n</svg>\n"},{"id":"crescent","name":"Crescent","description":"A thick crescent moon that rocks gently over the sung word.","motion":"Rocks like a little hammock: tilts back about 16° in the air, then tips forward on landing with a mild squash. A soft glow on the inner edge can breathe slowly, independent of the hop, for a quieter “night” feel on slow songs.","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\"\n     role=\"img\" aria-label=\"Crescent\">\n  <title>LyricGlass Crescent</title>\n  <desc>Karaoke bouncer for LyricGlass. Recolor by setting the CSS color property or, when inlined, --lg-bouncer on a parent (the host should also set color: var(--lg-bouncer)). Body uses currentColor; highlights are a white sheen and a dark overlay so any user colour still reads. When used as an image, the color=\"#FF3F4C\" presentation attribute is the default.</desc>\n  <g class=\"lg-bouncer lg-crescent\">\n\n    <g transform=\"translate(28.4 0) scale(-1 1)\">\n      <path class=\"lg-glow\" fill=\"currentColor\" opacity=\"0.16\" d=\"M15.26 19.35 A8.70 8.70 0 1 0 12.19 3.45 A8.20 8.20 0 0 1 15.26 19.35 Z\"/>\n      <path class=\"lg-body\" fill=\"currentColor\" d=\"M15.26 19.35 A8.70 8.70 0 1 0 12.19 3.45 A8.20 8.20 0 0 1 15.26 19.35 Z\"/>\n      <path class=\"lg-highlight\" fill=\"#FFFFFF\" opacity=\"0.45\" d=\"M18.6 8.4 C20.2 10.5 20.6 13.2 19.7 15.7 C20.8 13.3 20.6 10.6 18.9 8.3 C18.8 8.3 18.7 8.35 18.6 8.4 Z\"/>\n    </g>\n  </g>\n</svg>\n"}];
const EN = ["Dance","through","the","glass","tonight","we","light","every","word","you","sing","now"];
const HE = ["שרים","באור","הזכוכית","הלילה"];
const root = document.documentElement;
let currentType = ICONS[0].id;
let currentColor = "#FF3F4C";

function svgFor(id) {
  const ic = ICONS.find((x) => x.id === id);
  return ic ? ic.svg : '';
}
function setColor(hex) {
  currentColor = hex;
  root.style.setProperty('--lg-bouncer', hex);
  document.querySelectorAll('.swatch').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.color === hex)));
  document.getElementById('custom').value = hex;
}
function setType(id) {
  currentType = id;
  document.getElementById('type').value = id;
  document.querySelectorAll('.card').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.id === id)));
  paintLyrics();
}
function wordEl(text, typeId) {
  const el = document.createElement('span');
  el.className = 'word';
  el.dataset.word = text;
  el.innerHTML = '<span class="bo ' + typeId + '">' + svgFor(typeId) + '</span>' + text;
  return el;
}
function paintLyrics() {
  const en = document.getElementById('lyric-en');
  const he = document.getElementById('lyric-he');
  en.innerHTML = ''; he.innerHTML = '';
  EN.forEach((w) => en.appendChild(wordEl(w, currentType)));
  HE.forEach((w) => he.appendChild(wordEl(w, currentType)));
}
function paintGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  ICONS.forEach((ic) => {
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.dataset.id = ic.id;
    btn.setAttribute('aria-pressed', String(ic.id === currentType));
    btn.innerHTML = '<div class="thumb">' + ic.svg + '</div><h3>' + ic.name + '</h3>' +
      '<div class="sizes"><span class="s24">' + ic.svg + '</span><span class="s16">' + ic.svg + '</span>' +
      '<span class="s24 light">' + ic.svg + '</span><span class="s16 light">' + ic.svg + '</span></div>' +
      '<p>' + ic.description + '</p>';
    btn.addEventListener('click', () => setType(ic.id));
    grid.appendChild(btn);
  });
}
document.querySelectorAll('.swatch').forEach((b) => b.addEventListener('click', () => setColor(b.dataset.color)));
document.getElementById('custom').addEventListener('input', (e) => setColor(e.target.value));
document.getElementById('type').addEventListener('change', (e) => setType(e.target.value));

paintGrid();
setColor(currentColor);
setType(currentType);

const allWordParents = () => [...document.querySelectorAll('#lyric-en .word, #lyric-he .word')];
let idx = 0;
setInterval(() => {
  const words = allWordParents();
  if (!words.length) return;
  words.forEach((w) => w.classList.remove('active'));
  words[idx % words.length].classList.add('active');
  idx++;
}, 460);
</script>
</body>
