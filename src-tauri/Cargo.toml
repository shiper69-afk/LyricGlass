[package]
name = "lyricglass"
version = "0.1.0"
description = "LyricGlass Phase 0 spike — transparent lyrics overlay for Spotify on Windows"
authors = ["LyricGlass"]
edition = "2021"

[lib]
name = "lyricglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
futures = "0.3"
windows-future = "0.3"
windows = { version = "0.62", features = [
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true