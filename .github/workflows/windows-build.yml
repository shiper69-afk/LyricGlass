name: Windows build

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri app
        run: npm run tauri build

      - name: Smoke test release binary
        shell: pwsh
        run: |
          $exe = Resolve-Path "src-tauri/target/release/lyricglass.exe"
          Write-Host "Launching $exe for smoke test (diagnostics toggle)..."
          $env:LYRICGLASS_SMOKE_DIAG = "1"
          $env:LYRICGLASS_SMOKE_SINGLE_INSTANCE = "1"
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 22
          if ($proc.HasExited) {
            throw "lyricglass.exe exited early with code $($proc.ExitCode)"
          }
          $logDir = Join-Path $env:LOCALAPPDATA "LyricGlass\logs"
          $log = Get-ChildItem $logDir -Filter "lyricglass-*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $log) { throw "No LyricGlass log file under $logDir" }
          $text = Get-Content $log.FullName -Raw
          if ($text -notmatch "diag toggle \(smoke\):") {
            throw "Smoke diagnostics toggle not found in log $($log.FullName)"
          }
          if ($text -notmatch "diag toggle \(smoke\): after ui-state emit") {
            throw "Diagnostics toggle did not complete emit in log"
          }
          if ($text -match '\[watchdog\] main thread stall suspected') {
            throw "Watchdog reported main-thread stall during smoke run (false positive regression)"
          }
          if ($text -notmatch 'GSMTC RequestAsync') {
            throw "Media watcher never reached GSMTC RequestAsync in log"
          }
          if ($text -notmatch 'GSMTC RequestAsync: (completed|TIMEOUT)') {
            throw "Media watcher did not complete or time out GSMTC RequestAsync"
          }
          if ($text -notmatch 'smoke: second instance launched') {
            throw "Single-instance smoke did not launch second instance"
          }
          if ($text -notmatch 'focus \[single-instance/after\]: IsWindowVisible=true') {
            throw "Second launch did not restore visible main window (see single-instance focus log)"
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Smoke test passed (alive 12s, diagnostics toggle logged)"

      - name: NSIS silent install and uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $setup) { throw "NSIS setup.exe not found" }
          $instDir = Join-Path $env:LOCALAPPDATA "LyricGlass"
          $exe = Join-Path $instDir "lyricglass.exe"
          $uninst = Join-Path $instDir "uninstall.exe"

          if (Test-Path $uninst) {
            Start-Process -FilePath $uninst -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
          }

          Write-Host "Silent install: $($setup.FullName)"
          $installProc = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          if ($installProc.ExitCode -ne 0) {
            throw "Installer exit code $($installProc.ExitCode)"
          }
          if (-not (Test-Path $exe)) { throw "Expected installed exe at $exe" }

          Write-Host "Silent uninstall (app not running)"
          $uninstallProc = Start-Process -FilePath $uninst -ArgumentList "/S" -PassThru -Wait
          if ($uninstallProc.ExitCode -ne 0) {
            throw "Uninstall exit code $($uninstallProc.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "lyricglass.exe still present after uninstall" }

          Write-Host "Reinstall; uninstall while app is running"
          $null = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -PassThru -Wait
          if (-not (Test-Path $exe)) { throw "Reinstall failed" }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          $uninstallRunning = Start-Process -FilePath $uninst -ArgumentList "/S" -PassThru -Wait
          if (-not $app.HasExited) {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }
          if ($uninstallRunning.ExitCode -ne 0) {
            throw "Uninstall while running exit code $($uninstallRunning.ExitCode)"
          }
          Start-Sleep -Seconds 2
          if (Test-Path $exe) { throw "lyricglass.exe remains after uninstall-with-app-running" }
          Write-Host "NSIS install/uninstall regression passed"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lyricglass-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/lyricglass.exe